name: Publish

on:
  push:
    tags:
      - '*'
  workflow_dispatch: # zizmor: ignore[dangerous-triggers]

permissions: {}

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4096m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError" -Dkotlin.daemon.jvm.options="-Xmx2560m" -Dkotlin.incremental=false
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -PpreDexEnable=false --max-workers 4 --no-daemon
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.ANDROID_SIGNING_GPG }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.ANDROID_SIGNING_KEY_ID }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

jobs:
  ios:
    name: Publish to Swift repo
    runs-on: macos-26
    steps:
      - name: 🧮 Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install rust
        run: |
          rustup set profile minimal
          rustup show # installs from rust-toolchain.toml
          
      - name: Install targets
        run: make targets-ios
          
      - name: Set Xcode 26.5
        run: sudo xcode-select -switch /Applications/Xcode_26.5.app

      - name: Set SwiftPM Repo credentials
        uses: de-vri-es/setup-git-credentials@5dd446b3857806f44ea73acf83c193190a385d63 # v2.2.0
        with:
          credentials: https://${{secrets.PAT_USER}}:${{secrets.PAT}}@github.com/

      - name: Get tag
        id: tag
        uses: dawidd6/action-get-tag@727a6f0a561be04e09013531e73a3983a65e3479 # v1.1.0
          
      - name: Release iOS
        working-directory: platforms/ios/tools/release
        run: swift run release --version ${STEPS_TAG_OUTPUTS_TAG}
        env:
          SWIFT_RELEASE_TOKEN: ${{ secrets.PAT }}
          STEPS_TAG_OUTPUTS_TAG: ${{ steps.tag.outputs.tag }}

  android:
    name: Publish to maven
    runs-on: ubuntu-latest # No need for macos-latest if there are no UI tests
    steps:
      - name: 🧮 Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: ☕️ Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🔧 Rust & Cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          lookup-only: true

      - name: 🦀 Install Rust targets
        run: make targets-android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Build Android bindings
        run: make android-bindings

      - name: ⬆️ Publish to Sonatype
        working-directory: platforms/android
        run: ./gradlew generateReleaseKotlinBindings publishAndReleaseToMavenCentral

  npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 🧮 Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      - name: 🦀 Build Rust
        run: "make web"

      # Ensure npm 11.5.1 or later is installed
      - name: Update npm
        run: npm install -g npm@latest

      - name: 🔨 Install dependencies
        run: "yarn install --immutable"
        working-directory: platforms/web

      - name: 🪚 Build
        run: "yarn build"
        working-directory: platforms/web

      - name: 🚀 Publish to npm
        run: npm publish --access public --provenance
        working-directory: platforms/web
